name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.44.1
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-bin"
          chmod +x "$RUNNER_TEMP/xcodegen-bin/xcodegen"
          echo "$RUNNER_TEMP/xcodegen-bin" >> "$GITHUB_PATH"

      - name: Regenerate project
        run: "$RUNNER_TEMP/xcodegen-bin/xcodegen" generate

      - name: Verify generated project is current
        run: git diff --exit-code -- ShortcutCoach.xcodeproj

      - name: Test
        run: |
          xcodebuild \
            -project ShortcutCoach.xcodeproj \
            -scheme ShortcutCoach \
            -configuration Debug \
            -derivedDataPath .derived \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build
        run: |
          xcodebuild \
            -project ShortcutCoach.xcodeproj \
            -scheme ShortcutCoach \
            -configuration Debug \
            -derivedDataPath .derived-ci-build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Check repository diff
        run: git diff --check
