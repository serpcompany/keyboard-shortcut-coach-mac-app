name: ShortcutCoach
configs:
  Debug: debug
  Release: release
  DeveloperID: release
  AppStoreLite: release
options:
  bundleIdPrefix: com.serp
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Matthew Schumacher (847HR8U8D9)"
    DEVELOPMENT_TEAM: 847HR8U8D9
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ShortcutCoach:
    type: application
    platform: macOS
    sources:
      - ShortcutCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.shortcutcoach
        PRODUCT_NAME: ShortcutCoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shortcut Coach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 SERP. All rights reserved.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: ShortcutCoach/Resources/ShortcutCoach-AppStore.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_APP_SANDBOX: YES
        DeveloperID:
          CODE_SIGN_IDENTITY: "Developer ID Application: Matthew Schumacher (847HR8U8D9)"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_APP_SANDBOX: NO
  ShortcutCoachLite:
    type: application
    platform: macOS
    sources:
      - path: ShortcutCoach
        excludes:
          - Detection
      - ShortcutCoachLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.shortcutcoach.lite
        PRODUCT_NAME: ShortcutCoachLite
        PRODUCT_MODULE_NAME: ShortcutCoachLite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shortcut Coach Lite
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 SERP. All rights reserved.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: ShortcutCoach/Resources/ShortcutCoach-AppStore.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE_LITE
  ShortcutCoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShortcutCoachTests
    dependencies:
      - target: ShortcutCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.shortcutcoach.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShortcutCoach:
    build:
      targets:
        ShortcutCoach: all
        ShortcutCoachTests: [test]
    test:
      targets:
        - ShortcutCoachTests
  ShortcutCoach-DeveloperID:
    build:
      targets:
        ShortcutCoach: all
    run:
      config: DeveloperID
    archive:
      config: DeveloperID
  ShortcutCoach-Lite:
    build:
      targets:
        ShortcutCoachLite: all
    run:
      config: AppStoreLite
    archive:
      config: AppStoreLite
