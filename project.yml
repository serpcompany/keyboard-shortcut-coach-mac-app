name: ShortcutCoach
options:
  bundleIdPrefix: com.serpcompany
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Matthew Schumacher (847HR8U8D9)"
    DEVELOPMENT_TEAM: 847HR8U8D9
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ShortcutCoach:
    type: application
    platform: macOS
    sources:
      - ShortcutCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.shortcutcoach
        PRODUCT_NAME: ShortcutCoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shortcut Coach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
        ENABLE_APP_SANDBOX: NO
  ShortcutCoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShortcutCoachTests
    dependencies:
      - target: ShortcutCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.shortcutcoach.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShortcutCoach:
    build:
      targets:
        ShortcutCoach: all
        ShortcutCoachTests: [test]
    test:
      targets:
        - ShortcutCoachTests
